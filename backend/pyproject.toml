[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "hr-screening-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "docling==2.121.0",
  "fastapi==0.139.0",
  "openai==2.45.0",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "python-stdnum==2.2",
  "sqlalchemy==2.0.51",
  "supabase==2.31.0",
  "uvicorn[standard]==0.51.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "ipykernel==7.3.0",
  "pillow==11.3.0",
  "reportlab==4.5.1",
  "ruff==0.15.21",
  "pytest==9.1.1",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
